name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || secrets.DOCKER_FILE }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_DB_PASSWORD || secrets.DOCKER_FILE }}
        ports:
          - "1433:1433"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ODBC
        run: |
          if ! dpkg -s msodbcsql18 >/dev/null 2>&1; then
            curl -fsSL -o /tmp/mprod.deb "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i /tmp/mprod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
      - name: Install deps
        run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - name: Check CI_DB_PASSWORD
        run: |
          if [ -z "$CI_DB_PASSWORD" ]; then echo "::error::El secret CI_DB_PASSWORD esta vacio o no existe"; exit 1; fi
          echo "CI_DB_PASSWORD presente (${#CI_DB_PASSWORD} caracteres)"
      - name: Wait for SQL Server
        run: |
          cat > /tmp/sqlwait.py <<'PY'
          import os, sys, time, pyodbc
          pwd = os.environ["CI_DB_PASSWORD"].replace("}", "}}")
          cs = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD={" + pwd + "};TrustServerCertificate=yes;Encrypt=yes"
          last = None
          for i in range(60):
              try:
                  c = pyodbc.connect(cs, timeout=5)
                  if len(sys.argv) > 1:
                      c.autocommit = True
                      c.execute("IF DB_ID('sigos_test') IS NULL CREATE DATABASE sigos_test")
                  c.close(); print("SQL Server listo"); sys.exit(0)
              except Exception as e:
                  last = e; time.sleep(3)
          print("SQL Server no respondio:", last); sys.exit(1)
          PY
          python /tmp/sqlwait.py || { docker logs "${{ job.services.sqlserver.id }}" 2>&1 | tail -40; exit 1; }
      - name: Create test database
        run: python /tmp/sqlwait.py create
      - name: Run tests
        run: |
          cd services/api
          ENC=$(python -c "import os,urllib.parse;print(urllib.parse.quote_plus(os.environ['CI_DB_PASSWORD']))")
          DB_URL="mssql+pyodbc://sa:${ENC}@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" \
          TEST_DB_URL="mssql+pyodbc://sa:${ENC}@localhost:1433/sigos_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" \
          python -m pytest tests/ -v

  build-api-image:
    runs-on: ubuntu-latest
    needs: api-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: false
          load: true
          tags: sigos-api:ci
      - name: Start container
        run: |
          docker run -d --name sigos-api -p 5000:5000 \
            -e DB_URL=sqlite:////tmp/sigos.db \
            -e JWT_SECRET_KEY=ci-secret \
            sigos-api:ci
      - name: Verify health endpoint
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/v1/health || true)"
            if [ "$code" = "200" ]; then
              echo "health endpoint returned 200"
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not return 200"
          docker logs sigos-api || true
          exit 1
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/sigos-api" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < services/api/VERSION 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMG="${{ steps.meta.outputs.image }}"
          for t in latest "${{ steps.meta.outputs.version }}" "sha-${GITHUB_SHA::7}"; do
            [ -n "$t" ] || continue
            docker tag sigos-api:ci "$IMG:$t"
            docker push "$IMG:$t"
          done

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install deps
        run: cd apps/desktop && npm install
      - name: Run tests
        run: cd apps/desktop && npm test

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
      - name: Install deps
        run: cd apps/mobile && flutter pub get
      - name: Run tests
        run: cd apps/mobile && flutter test

  build-desktop:
    runs-on: windows-latest
    needs: [desktop-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install deps
        run: cd apps/desktop && npm install
      - name: Build installer
        run: cd apps/desktop && npm run dist
      - uses: actions/upload-artifact@v6
        with:
          name: sigos-desktop-installer
          path: apps/desktop/dist/*.exe

  build-mobile:
    runs-on: ubuntu-latest
    needs: [mobile-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
      - name: Build APK
        run: cd apps/mobile && flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: sigos-mobile-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
