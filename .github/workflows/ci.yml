name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "${{ secrets.CI_DB_PASSWORD }}"
        ports:
          - "1433:1433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          sudo add-apt-repository "$(curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
          sudo apt-get update
          sudo apt-get install -y msodbcsql18
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            python -c "import pyodbc; pyodbc.connect('DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost;UID=sa;PWD=${{ secrets.CI_DB_PASSWORD }};TrustServerCertificate=yes')" && break
            sleep 2
          done
        run: |
          python -c "import pyodbc; c=pyodbc.connect('DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost;UID=sa;PWD=${{ secrets.CI_DB_PASSWORD }};TrustServerCertificate=yes'); c.autocommit=True; c.execute(\"IF DB_ID('sigos_test') IS NULL CREATE DATABASE sigos_test\"); c.close()"

      - name: Install deps
        run: pip install -r services/api/requirements.txt
      - name: Run tests
        run: cd services/api && python -m pytest tests/ -v
        env:
          DB_URL: mssql+pyodbc://sa:${{ secrets.CI_DB_PASSWORD }}@localhost:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
          TEST_DB_URL: mssql+pyodbc://sa:${{ secrets.CI_DB_PASSWORD }}@localhost:1433/sigos_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: cd apps/desktop && npm install
      - name: Run tests
        run: cd apps/desktop && npm test

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install deps
        run: cd apps/mobile && flutter pub get
      - name: Run tests
        run: cd apps/mobile && flutter test

  build-desktop:
    runs-on: windows-latest
    needs: [desktop-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: cd apps/desktop && npm install
      - name: Build installer
        run: cd apps/desktop && npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: sigos-desktop-installer
          path: apps/desktop/dist/*.exe

  build-mobile:
    runs-on: ubuntu-latest
    needs: [mobile-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        run: cd apps/mobile && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sigos-mobile-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
