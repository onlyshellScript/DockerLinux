# Despliegue de producción (Linux) de SIGOS API.
# Uso:
#   cp infra/docker/.env.prod.example infra/docker/.env   # y rellenar valores
#   docker compose -f infra/docker/docker-compose.prod.yaml --env-file infra/docker/.env up -d --build
name: sigos

x-api-env: &api-env
  DB_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatorio}@sqlserver:1433/${DB_NAME:-sigos}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatorio}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  WHATSAPP_API_URL: "${WHATSAPP_API_URL:-}"
  WHATSAPP_API_TOKEN: "${WHATSAPP_API_TOKEN:-}"
  UPLOAD_DIR: /app/uploads
  TZ: "${TZ:-America/Bogota}"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${MSSQL_IMAGE_TAG:-2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD es obligatorio}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    # Sin puertos publicados: solo accesible desde la red interna del compose.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    image: sigos-api:${SIGOS_VERSION:-latest}
    command: ["api"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5000}:5000"
    environment:
      <<: *api-env
      ENABLE_NOTIFICATION_WORKER: "false"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
    volumes:
      - api-uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker:
    image: sigos-api:${SIGOS_VERSION:-latest}
    command: ["worker"]
    environment:
      <<: *api-env
      NOTIFICATION_WORKER_INTERVAL: "${NOTIFICATION_WORKER_INTERVAL:-30}"
    volumes:
      - api-uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  api-uploads:
  sqlserver-data:
