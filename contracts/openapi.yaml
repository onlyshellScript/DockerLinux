openapi: 3.0.3
info:
  title: SIGOS 2.0 API
  version: 0.2.0
  description: Central API for SIGOS 2.0 desktop and mobile clients.
servers:
  - url: http://localhost:5000
paths:
  /api/v1/health:
    get:
      summary: Service health
      responses:
        '200':
          description: Service and critical dependencies are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          description: One or more critical dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
  /api/v1/auth/login:
    post:
      summary: Authenticate user and obtain tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful.
        '401':
          description: Invalid credentials.
        '429':
          description: Too many attempts.
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed.
        '401':
          description: Invalid refresh token.
  /api/v1/auth/logout:
    post:
      summary: Cierra la sesion (revoca en el servidor el access y el refresh token de esa sesion)
      description: Acepta el access token (Authorization Bearer, aunque haya vencido) y/o refresh_token en el cuerpo. Idempotente.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: 'Sesion cerrada. {"message": "logged out", "revoked": bool}' }
        '400': { description: Sin token. }
  /api/v1/users:
    get:
      summary: List users (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users.
        '401':
          description: Unauthorized.
        '403':
          description: Insufficient permissions.
    post:
      summary: Create user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role_names:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: User created.
        '401':
          description: Unauthorized.
        '403':
          description: Insufficient permissions.
  /api/v1/users/{user_id}:
    get:
      summary: Get user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details.
        '404':
          description: User not found.
    put:
      summary: Update user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                is_active:
                  type: boolean
                role_names:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: User updated.
        '404':
          description: User not found.
  /api/v1/work-orders:
    get:
      summary: List work orders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, completed, closed, cancelled]
        - name: assigned_to_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of work orders.
        '401':
          description: Unauthorized.
    post:
      summary: Create work order (admin or dispatcher)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high]
                customer_name:
                  type: string
                customer_phone:
                  type: string
                address:
                  type: string
                assigned_to_id:
                  type: integer
      responses:
        '201':
          description: Work order created.
        '401':
          description: Unauthorized.
        '403':
          description: Insufficient permissions.
  /api/v1/work-orders/{wo_id}:
    get:
      summary: Get work order
      security:
        - bearerAuth: []
      parameters:
        - name: wo_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Work order details.
        '404':
          description: Not found.
    put:
      summary: Update work order (admin or dispatcher)
      security:
        - bearerAuth: []
      parameters:
        - name: wo_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                assigned_to_id:
                  type: integer
      responses:
        '200':
          description: Work order updated.
        '404':
          description: Not found.
  /api/v1/work-orders/{wo_id}/status:
    post:
      summary: Change work order status
      security:
        - bearerAuth: []
      parameters:
        - name: wo_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status]
              properties:
                to_status:
                  type: string
                  enum: [pending, assigned, in_progress, completed, closed, cancelled]
                notes:
                  type: string
      responses:
        '200':
          description: Status changed.
        '400':
          description: Invalid transition.
        '403':
          description: Insufficient permissions.
        '404':
          description: Not found.
  /api/v1/work-orders/{wo_id}/history:
    get:
      summary: Get status history
      security:
        - bearerAuth: []
      parameters:
        - name: wo_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Status history.
        '404':
          description: Not found.
  /api/v1/material-categories:
  get:
    summary: List material categories
    security: [ { bearerAuth: [] } ]
    responses:
      '200': { description: Categories. }
/api/v1/material-units:
  get:
    summary: List material units
    security: [ { bearerAuth: [] } ]
    responses:
      '200': { description: Units. }
/api/v1/material-catalog:
  get:
    summary: List material catalog
    security: [ { bearerAuth: [] } ]
    parameters:
      - { name: q, in: query, schema: { type: string } }
      - { name: category, in: query, schema: { type: string } }
      - { name: available, in: query, schema: { type: boolean } }
      - { name: stage, in: query, schema: { type: string } }
      - { name: applies_to, in: query, schema: { type: string } }
    responses:
      '200': { description: Catalog items. }
  post:
    summary: Add catalog item (admin)
    security: [ { bearerAuth: [] } ]
    responses:
      '201': { description: Created. }
      '409': { description: Duplicate. }
/api/v1/materials:
    get:
      summary: List materials
      security:
        - bearerAuth: []
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ok, low, critical]
        - name: unit
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of materials with counts and total value.
    post:
      summary: Create material (admin or dispatcher)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, unit]
              properties:
                name:
                  type: string
                code:
                  type: string
                description:
                  type: string
                unit:
                  type: string
                current_stock:
                  type: number
                min_stock:
                  type: number
                unit_price:
                  type: number
      responses:
        '201':
          description: Material created.
  /api/v1/materials/{mat_id}:
    get:
      summary: Get material
      security:
        - bearerAuth: []
      parameters:
        - name: mat_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Material details.
        '404':
          description: Not found.
    put:
      summary: Update material (admin or dispatcher)
      security:
        - bearerAuth: []
      parameters:
        - name: mat_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Material updated.
  /api/v1/materials/{mat_id}/movements:
    get:
      summary: List stock movements
      security:
        - bearerAuth: []
      parameters:
        - name: mat_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Movement history.
    post:
      summary: Register stock movement (admin or dispatcher)
      security:
        - bearerAuth: []
      parameters:
        - name: mat_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, movement_type]
              properties:
                quantity:
                  type: number
                movement_type:
                  type: string
                  enum: [IN, OUT, CONSUMPTION]
                work_order_id:
                  type: integer
                notes:
                  type: string
      responses:
        '201':
          description: Movement registered.
        '400':
          description: Insufficient stock.
  /api/v1/technician-profiles:
    get:
      summary: List technician profiles
      security:
        - bearerAuth: []
      parameters:
        - name: is_available
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of profiles.
    post:
      summary: Create technician profile (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
                phone:
                  type: string
                specialty:
                  type: string
                is_available:
                  type: boolean
      responses:
        '201':
          description: Profile created.
  /api/v1/technician-profiles/{profile_id}:
    get:
      summary: Get technician profile
      security:
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Profile details.
    put:
      summary: Update technician profile
      security:
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated.
  /api/v1/work-orders/{wo_id}/evidences:
    get:
      summary: List evidences for a work order
      security:
        - bearerAuth: []
      parameters:
        - name: wo_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of evidences.
        '404':
          description: Work order not found.
    post:
      summary: Upload evidence (photo, document or observation)
      security:
        - bearerAuth: []
      parameters:
        - name: wo_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [evidence_type]
              properties:
                evidence_type:
                  type: string
                  enum: [photo, document, observation]
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        '201':
          description: Evidence uploaded.
        '400':
          description: Invalid file type or missing file.
        '403':
          description: Insufficient permissions.
        '404':
          description: Work order not found.
  /api/v1/evidences/{ev_id}/download:
    get:
      summary: Download evidence file
      security:
        - bearerAuth: []
      parameters:
        - name: ev_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File content.
        '404':
          description: Not found.
  /api/v1/evidences/{ev_id}:
    delete:
      summary: Delete evidence (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: ev_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted.
        '403':
          description: Insufficient permissions.
        '404':
          description: Not found.
  /api/v1/work-orders/{wo_id}/cancellation:
    get:
      summary: Si la orden puede cancelarse y qué registros asociados se conservan (admin, coordinador)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: wo_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{can_cancel, blocked_code, blocked_reason, impacts: {evidences, approved_evidences, material_consumptions, open_material_requests}}' }
        '403': { description: Solo admin o coordinador. }
        '404': { description: Orden inexistente. }
  /api/v1/work-orders/{wo_id}/cancel:
    post:
      summary: Cancelación lógica de una orden (admin, coordinador); no elimina registros
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: wo_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, nullable: true, maxLength: 1000 } } }
      responses:
        '200': { description: Orden cancelada. }
        '403': { description: Solo admin o coordinador. }
        '409': { description: 'already_cancelled | terminal_order | invalid_transition' }
  /api/v1/evidences/orders:
    get:
      summary: Ordenes con resumen de evidencias (sin archivos), paginado
      description: Admin y coordinador ven todas; un tecnico solo sus ordenes asignadas (technician_id se ignora para el).
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Numero de orden (12, OS-0012) o texto de titulo/cliente' }
        - { name: technician_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: with_evidence, in: query, schema: { type: boolean } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: '{items: [{work_order, technician, evidence_count, last_evidence_at, validation_status}], total, page, page_size}' }
        '400': { description: Fecha invalida. }
  /api/v1/evidences/{ev_id}/technician-signature:
    get:
      summary: Imagen PNG de la firma historica del tecnico con la que se registro la evidencia
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: ev_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: PNG. }
        '403': { description: Sin acceso a la orden. }
        '404': { description: La evidencia no tiene firma o el archivo no existe. }
        '409': { description: El archivo no coincide con la huella registrada (signature_integrity_error). }
  /api/v1/me/signature:
    get:
      summary: Firma de perfil vigente del tecnico autenticado (metadatos)
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: '{signature: {id, user_id, sha256, version, is_active, created_at} | null}' }
        '403': { description: Solo tecnicos. }
    post:
      summary: Registra una nueva version de la firma de perfil (PNG del recuadro de dibujo)
      description: El propietario es siempre el usuario del token. Las versiones anteriores se conservan intactas.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: 'data:image/png;base64,...' }
      responses:
        '201': { description: Firma registrada. }
        '400': { description: 'signature_empty | signature_blank | signature_invalid_format | signature_invalid_size | signature_too_large | signature_invalid_image' }
        '403': { description: Solo tecnicos. }
  /api/v1/me/signature/image:
    get:
      summary: Imagen PNG de la firma de perfil vigente
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: PNG. }
        '404': { description: Sin firma registrada. }
  /api/v1/sync/push:
    post:
      summary: Push offline operations (idempotent)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [client_operation_id, operation_type, payload]
                    properties:
                      client_operation_id:
                        type: string
                        format: uuid
                      operation_type:
                        type: string
                        enum: [change_status, add_observation]
                      payload:
                        type: object
      responses:
        '200':
          description: Results per operation (synced/failed/duplicate).
        '400':
          description: Invalid request.
  /api/v1/sync/pull:
    get:
      summary: Pull changes since timestamp
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Changes since timestamp.
  /api/v1/notifications:
    get:
      summary: List notifications (own for non-admin, all for admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, sent, failed]
      responses:
        '200':
          description: List of notifications.
    post:
      summary: Enqueue notification (admin or dispatcher)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, channel, recipient, message]
              properties:
                user_id:
                  type: integer
                channel:
                  type: string
                  enum: [email, whatsapp]
                recipient:
                  type: string
                subject:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Notification enqueued.
        '400':
          description: Invalid request.
        '403':
          description: Insufficient permissions.
  /api/v1/notifications/process:
    post:
      summary: Process pending notifications (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number processed.
  /api/v1/dashboard/summary:
    get:
      summary: Dashboard gerencial summary
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          schema:
            type: integer
            enum: [7, 14, 30]
        - name: zone
          in: query
          schema:
            type: string
        - name: technician_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Dashboard summary.
        '401':
          description: Missing or invalid token.
        '403':
          description: Insufficient permissions.
  /api/v1/calendar/validate:
    post:
      summary: Validate a proposed schedule without applying it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                start:
                  type: string
                end:
                  type: string
                technician_ids:
                  type: array
                  items:
                    type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Validation result.
        '403':
          description: Insufficient permissions.
        '404':
          description: Order not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [UP, DOWN]





