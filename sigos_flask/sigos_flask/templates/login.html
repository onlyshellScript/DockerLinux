{% extends "base.html" %}
{% block title %}Iniciar sesión · SIGOS{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F2EB">
  <div class="sigos-card" style="width:420px;padding:32px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">
      <div class="sb-logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="3" fill="white" stroke="none"/></svg></div>
      <div class="tb-title" style="font-size:20px">SIGOS</div></div>
    <h2 style="font-family:Outfit;font-size:20px;color:#163028;margin-bottom:16px">Iniciar sesión</h2>
    {% if error %}<div style="background:#FEE2E2;color:#991B1B;border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:14px">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="fld"><label>Correo</label><input class="sigos-input" name="email" type="email" required></div>
      <div class="fld"><label>Contraseña</label><input class="sigos-input" name="password" type="password" required></div>
      <button class="sigos-btn-primary" style="width:100%;justify-content:center;padding:10px">Entrar</button>
    </form>
    <div class="section-label" style="margin:20px 0 8px">Cuentas demo</div>
    {% for a in accounts %}<a class="sigos-card sigos-card--interactive sigos-role-option" href="{{ url_for('login_demo', role=a.role) }}" style="display:block;padding:10px 12px;margin-bottom:6px;text-decoration:none;color:inherit"><b style="font-size:13px">{{ a.role }}</b> <span style="font-size:12px;color:#96908A">· {{ a.name }}</span></a>{% endfor %}
  </div>
</div>
{% endblock %}
